<div class="items" [ngClass]="{ empty: ! fetching && ! filteredItems.length }">
  @if ( fetching ) {
    <app-loading-spinner></app-loading-spinner>
  }
  @else {
    @for (item of filteredItems; track item.updatedAt; let i = $index) {
      <app-item
      [item]="item"
      showCollection
      (onItemUpdate)="onItemUpdated(i, $event)"
      (onTagFilter)="onTagFilter(item.spaceId, item.collectionId, $event)">
      </app-item>
    }
    @empty {
      <app-empty-placeholder
      assetFilename="images/search-frown.png"
      title="No results found!"
      message="Adjust your search criteria to view items across all collections...">
      </app-empty-placeholder>
    }
  }
</div>
