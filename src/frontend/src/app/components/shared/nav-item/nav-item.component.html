@if ( icon ) {
  <app-icon
  [icon]="icon" 
  [iconSize]="iconSize"
  [containerSize]="iconContainerSize || iconSize"
  [color]="finalAccentColor"></app-icon>
}

<span class="label" [ngStyle]="{
  color: selected || forceAccentColor ? finalAccentColor : 'currentColor'
}">{{ label }}</span>

@if ( badge !== undefined && (! actionIcon || ! hovered) ) {
  <span
  class="badge"
  [ngStyle]="{
    backgroundColor: selected ? finalAccentColor : ''
  }"
  [ngClass]="{
    selected,
    'high-contrast': highContrastAccentColor
  }">
    {{ badge.toLocaleString() }}
  </span>
}

@if ( hovered && (actionIcon || secondaryActionIcon) ) {
  <div class="action-icons">
    @if ( secondaryActionIcon && hovered ) {
      <app-icon
      [icon]="secondaryActionIcon"
      [iconSize]="secondaryActionIconSize"
      [containerSize]="secondaryActionIconContainerSize || secondaryActionIconSize"
      [color]="secondaryActionIconHovered ? finalSecondaryActionIconHoverColor : 'currentColor'"
      (mouseenter)="onSecondaryActionIconMouseEnter()"
      (mouseleave)="onSecondaryActionIconMouseLeave()"
      (click)="onSecondaryActionIconClick($event)">
      </app-icon>
    }
    
    @if ( actionIcon && hovered ) {
      <app-icon
      [icon]="actionIcon"
      [iconSize]="actionIconSize"
      [containerSize]="actionIconContainerSize || actionIconSize"
      [color]="actionIconHovered ? finalActionIconHoverColor : 'currentColor'"
      (mouseenter)="onActionIconMouseEnter()"
      (mouseleave)="onActionIconMouseLeave()"
      (click)="onActionIconClick($event)">
      </app-icon>
    }
  </div>
}
