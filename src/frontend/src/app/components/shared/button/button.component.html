<button
type="button"
class="{{ type }}"
[ngClass]="{
  'color-override': allowColorOverrides,
  'transparent': transparentBackground,
  'compact': compact
}"
[disabled]="disabled"
(click)="onButtonClick()">
  @if ( icon ) {
    <app-icon
    [icon]="icon"
    [iconSize]="iconSize"
    [containerSize]="iconContainerSize"
    color="currentColor"
    [ngClass]="{ standalone: ! label }">
    </app-icon>
  }
  {{ label }}
</button>
